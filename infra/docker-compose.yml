services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: xpool
      POSTGRES_PASSWORD: xpool
      POSTGRES_DB: xpool
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpool -d xpool"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      BIND_ADDR: 0.0.0.0:8081
      DATABASE_URL: postgres://xpool:xpool@postgres:5432/xpool?sslmode=disable
      XMRIG_PROXY_API_URL: http://xmrig-proxy:8080
      XMRIG_PROXY_API_TOKEN: ${XMRIG_PROXY_ACCESS_TOKEN:-devtoken}
      PROXY_HOST: localhost
      PROXY_PORT: "3333"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  xmrig-proxy:
    platform: linux/amd64
    build:
      context: xmrig-proxy
    command:
      - xmrig-proxy
      - -o
      - pool.hashvault.pro:443
      - --tls
      - --coin
      - monero
      - -u
      - ${HASHVAULT_WALLET_ADDRESS:?set HASHVAULT_WALLET_ADDRESS in .env}
      - -p
      - ${HASHVAULT_POOL_PASSWORD:-x}
      - --bind
      - 0.0.0.0:3333
      - --mode
      - simple
      - --custom-diff
      - ${XMRIG_CUSTOM_DIFF:-10000}
      - --custom-diff-stats
      - --http-host
      - 0.0.0.0
      - --http-port
      - "8080"
      - --http-access-token
      - ${XMRIG_PROXY_ACCESS_TOKEN:-devtoken}
      - --verbose
    ports:
      - "127.0.0.1:3333:3333"
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
