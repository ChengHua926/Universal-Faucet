name: Build & push crossroads-oracle image

# Builds the Model B oracle container and pushes it to GitHub Container Registry
# (ghcr.io). ROFL pins the image by digest, so each run prints the pushed digest
# in the job summary — copy it into cr-near-01/crossroads_oracle/compose.yaml,
# then run `oasis rofl build && oasis rofl deploy`.

on:
  push:
    branches: [crossroads, main]
    paths:
      - "cr-near-01/crossroads_oracle/**"
      - ".github/workflows/oracle-image.yml"
  workflow_dispatch: {}

env:
  # ghcr/Docker repository names must be lowercase, so this is hardcoded lowercase
  # (the repo owner is ChengHua926). GITHUB_TOKEN can push here out of the box.
  # To push to a different account, change this and supply a PAT with
  # write:packages in the login step below.
  IMAGE_NAME: ghcr.io/chenghua926/crossroads-oracle

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push (linux/amd64 — required by ROFL TDX)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: cr-near-01/crossroads_oracle
          file: cr-near-01/crossroads_oracle/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report pushed digest
        run: |
          echo "## crossroads-oracle pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this digest in \`cr-near-01/crossroads_oracle/compose.yaml\`:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "    image: \"${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}\"" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Then: \`oasis rofl build && oasis rofl deploy && oasis rofl machine show\`" >> "$GITHUB_STEP_SUMMARY"
