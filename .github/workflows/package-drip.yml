name: Package drip

on:
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: darwin-arm64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libuv1-dev libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake libuv openssl@3

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build source-patched XMRig
        env:
          DRIP_XMRIG_PLATFORM: ${{ matrix.platform }}
        run: scripts/package-xmrig.sh

      - name: Build drip release archive
        env:
          DRIP_XMRIG_PLATFORM: ${{ matrix.platform }}
        run: scripts/package-drip.sh

      - name: Upload drip package
        uses: actions/upload-artifact@v4
        with:
          name: drip-${{ matrix.platform }}
          path: |
            dist/drip-${{ matrix.platform }}.tar.gz
            dist/drip-${{ matrix.platform }}.tar.gz.sha256
