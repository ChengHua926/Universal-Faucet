services:
  oracle:
    build: .
    image: "ghcr.io/chenghua926/crossroads-oracle@sha256:7c0b08d48ecf31c47e5de63ea4699df80c651b3211c91cd5ea8aaf8f9e44e286"
    platform: linux/amd64
    restart: on-failure
    ports:
      # Expose the signed-report HTTP API.
      - "8080:8080"
    volumes:
      # THE critical ROFL-specific line: mount the appd Unix socket into the
      # container so our code can derive the KMS signer + sign/submit txs.
      - /run/rofl-appd.sock:/run/rofl-appd.sock
    environment:
      # Model B: register a header signer via appd, then serve signed reports.
      ORACLE_MODE: rofl
      # Sapphire target + the deployed HeaderReportOracle.
      TARGET_RPC_URL: https://testnet.sapphire.oasis.io
      SAPPHIRE_CHAIN_ID: "23295"
      # Deployed HeaderReportOracle (Model B), bound to IC3 app id 0x002339e3…
      ORACLE_CONTRACT_ADDRESS: "0x2e56383c7aCA466de0262A96f2b5e5ee3Fc26bC6"
      # 3 independent Sepolia RPCs; only sign a hash >= quorum of them recompute.
      SOURCE_RPC_URLS: https://ethereum-sepolia-rpc.publicnode.com,https://sepolia.drpc.org,https://public.1rpc.io/sepolia
      SOURCE_RPC_QUORUM: "2"
      SOURCE_CONFIRMATIONS: "12"
      SOURCE_CHAIN_ID: "11155111"
      SOURCE_REQUIRE_FINALIZED: "0"
      HEADER_REPORT_TTL_SECONDS: "1800"
      HEADER_REPORT_CACHE_SIZE: "512"
      HEADER_REPORT_CACHE_REFRESH_SECONDS: "120"
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8080"
      HTTP_RATE_LIMIT_PER_MINUTE: "60"
      # Deterministic KMS key id for the header signer. Changing it = rotation.
      ROFL_KMS_KEY_ID: "crossroads-header-signer-v1"
      ALLOW_SIGNER_ROTATION: "0"
      PYTHONUNBUFFERED: "1"
